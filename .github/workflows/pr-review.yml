name: 自动 PR 审核

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality_check:
    name: 审核改动并运行项目检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      check_required: ${{ steps.changes.outputs.check_required }}
      check_output_base64: ${{ steps.check.outputs.check_output_base64 }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 获取 PR 改动文件
        id: changes
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const filenames = files.map((file) => file.filename);
            const checkPaths = [
              /^src\//u,
              /^test\//u,
              /^image\//u,
              /^package\.json$/u,
              /^pnpm-lock\.yaml$/u,
              /^tsconfig\.json$/u,
              /^tsdown\.config\.ts$/u,
            ];
            const checkRequired = filenames.some((filename) =>
              checkPaths.some((pattern) => pattern.test(filename)),
            );

            core.setOutput('check_required', String(checkRequired));

      - name: 安装 pnpm
        if: steps.changes.outputs.check_required == 'true'
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        if: steps.changes.outputs.check_required == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 安装完整依赖
        if: steps.changes.outputs.check_required == 'true'
        run: pnpm install --frozen-lockfile

      - name: 运行测试、检查和构建
        id: check
        if: steps.changes.outputs.check_required == 'true'
        shell: bash
        run: |
          set +e
          : > quality-output.log
          pnpm test 2>&1 | tee -a quality-output.log
          CHECK_STATUS=${PIPESTATUS[0]}
          if [[ "$CHECK_STATUS" -eq 0 ]]; then
            pnpm build 2>&1 | tee -a quality-output.log
            CHECK_STATUS=${PIPESTATUS[0]}
          fi
          if [[ "$CHECK_STATUS" -eq 0 ]]; then
            pnpm check 2>&1 | tee -a quality-output.log
            CHECK_STATUS=${PIPESTATUS[0]}
          fi

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const ansiPattern = /[\u001B\u009B][[\]()#;?]*(?:(?:(?:[\dA-PR-TZcf-nq-uy=><~])+\x07)|(?:(?:\d{1,4}(?:[;:]\d{0,4})*)?[\dA-PR-TZcf-nq-uy=><~]))/gu;
          const output = readFileSync('quality-output.log', 'utf8').replace(ansiPattern, '');
          const maxLength = 12000;
          const truncated = output.length > maxLength
            ? `...前面的输出已省略...\n${output.slice(-maxLength)}`
            : output;
          const encoded = Buffer.from(truncated, 'utf8').toString('base64');
          appendFileSync(process.env.GITHUB_OUTPUT, `check_output_base64=${encoded}\n`);
          NODE

          exit "$CHECK_STATUS"

  review-comment:
    name: 更新审核摘要
    needs: quality_check
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: 更新 PR 评论
        uses: actions/github-script@v9
        env:
          CHECK_REQUIRED: ${{ needs.quality_check.outputs.check_required }}
          CHECK_OUTPUT_BASE64: ${{ needs.quality_check.outputs.check_output_base64 }}
          CHECK_JOB_RESULT: ${{ needs.quality_check.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- fraq-pr-review -->';
            const checkRequired = process.env.CHECK_REQUIRED === 'true';
            const jobResult = process.env.CHECK_JOB_RESULT;
            const result = jobResult !== 'success' ? jobResult : checkRequired ? 'success' : 'skipped';
            const passed = result === 'success' || result === 'skipped';
            const title = passed
              ? '# 自动审核通过，请等待人工审核/合并'
              : '# 自动审核失败，请修复后重新提交';
            const checkStatus = result === 'success'
              ? '检查通过'
              : result === 'skipped'
                ? '未运行（本次改动无需检查）'
                : '检查失败';
            const checkOutput = process.env.CHECK_OUTPUT_BASE64
              ? Buffer.from(process.env.CHECK_OUTPUT_BASE64, 'base64').toString('utf8')
              : '';
            const escapedCheckOutput = checkOutput
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');
            const checkLog = checkRequired
              ? escapedCheckOutput || '未捕获到项目检查日志。'
              : '本次改动无需运行项目检查。';
            const body = [
              marker,
              title,
              '',
              '<details>',
              '<summary>项目检查日志</summary>',
              '',
              '<pre>',
              checkLog,
              '</pre>',
              '</details>',
              '',
              '| 项目 | 内容 |',
              '| :--: | :--: |',
              `| 项目检查结果 | ${checkStatus} |`,
              `| PR 提交 hash 值 | \`${process.env.HEAD_SHA.slice(0, 7)}\` |`,
              `| 本次自动测试记录 | [点击这里查看](${process.env.RUN_URL}) |`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
